# OpenOCD configuration for CC2630 via SWD (2-wire) with J-Link
#
# Use this when only TMSC and TCKC are available (no TDI/TDO)

source [find interface/jlink.cfg]
transport select swd
adapter speed 1000

set _CHIPNAME cc26x0

swd newdap $_CHIPNAME cpu -expected-id 0x4BA00477
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $_CHIPNAME.dap

$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size 0x4000 -work-area-backup 0

set _FLASHNAME $_CHIPNAME.flash
flash bank $_FLASHNAME cc26xx 0 0 0 0 $_TARGETNAME
